# 需要动手的活动类型列表（会降低回复频率）/ Activity types that require hands-on work (will reduce reply frequency)
# 格式: 活动类型1,活动类型2,活动类型3 / Format: activity_type1,activity_type2,activity_type3
# 这些活动类型会降低回复频率，因为需要动手操作 / These activity types will reduce reply frequency because they require hands-on work
#
# 【可用活动类型列表 / Available Activity Types】:
#   work      - 工作/学习（如：计划开始工作、准备学习、安排编程任务）
#   leisure   - 休闲娱乐（如：计划玩游戏、准备看电影、安排休息时间）
#   meal      - 用餐（如：计划早餐、安排午餐、准备晚餐）
#   sleep     - 睡眠（如：计划睡觉、准备午休）
#   exercise  - 运动（如：计划跑步、准备健身、安排散步）
#   study     - 学习（如：计划阅读、准备复习、安排学习时间）
#   other     - 其他（如：计划购物、准备外出、安排其他事务）
#   rest      - 休息（如：计划休息、准备小憩、安排放松时间）
#   medical   - 医疗（如：计划就医、准备治疗、安排体检）
#
# 【示例 / Examples】:
#   reduction_activities = "work,study,exercise"      # 工作、学习、运动时降低回复
#   reduction_activities = "meal,other"               # 用餐、其他事务时降低回复
#   reduction_activities = "exercise,other,medical"   # 运动、其他事务、医疗时降低回复
#   reduction_activities = "work,study,exercise,medical"  # 多种活动类型组合
#
# 【推荐配置 / Recommended Configuration】:
#   - 专注模式: "work,study,exercise,medical"（工作、学习、运动、医疗时降低回复）
#   - 轻松模式: "exercise,other"（仅运动、其他事务时降低回复）
#   - 严格模式: "work,study,exercise,other,medical"（大部分活动都降低回复）
#
reduction_activities = "work,study,exercise,medical"

# 回复概率降低因子 / Reply probability reduction factor
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 0.0表示不降低回复频率，1.0表示完全不回复 / 0.0 means no reduction, 1.0 means no reply at all
# 建议: 0.3-0.7 / Recommended: 0.3-0.7
# 实际回复概率 = 原始回复概率 * (1 - reduction_factor) / Actual reply probability = original probability * (1 - reduction_factor)
#
# 【示例 / Examples】:
#   reduction_factor = 0.3  # 降低30%回复概率（轻微降低）
#   reduction_factor = 0.5  # 降低50%回复概率（中等降低，推荐）
#   reduction_factor = 0.7  # 降低70%回复概率（大幅降低）
#   reduction_factor = 1.0  # 降低100%回复概率（完全不回复）
#
reduction_factor = 0.5