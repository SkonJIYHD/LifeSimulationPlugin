4. 生病系统：当疲劳度高（>70）、饥饿度高（>70）、或情绪持续低落时，更容易产生生病事件
5. 生病类型：轻微不适（-5到-10）、生病（-10到-20）、严重生病（-20到-30）
6. 康复事件：当健康状态不佳时，可以生成康复事件（+5到+15）
7. 负面事件概率要低一些（0.05-0.2）
8. 事件描述要生动自然

生病系统说明：
- 健康度范围：0-100（越高越健康）/ Health range: 0-100 (higher is healthier)
- 健康状态 / Health status:
  * healthy (80-100): 健康 / Healthy
  * recovering (60-79): 康复中 / Recovering
  * slightly_ill (40-59): 轻微不适 / Slightly ill
  * ill (20-39): 生病 / Ill
  * seriously_ill (0-19): 严重生病 / Seriously ill
- 生病后会重新生成符合病情的日程 / Schedule will be regenerated based on illness
- 康复后会重新生成正常日程 / Schedule will be regenerated after recovery

请只返回JSON对象，不要有其他内容。"""

