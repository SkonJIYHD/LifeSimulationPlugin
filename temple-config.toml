# ============================================================
# LifeSimulationPlugin 配置文件
# Event and Human Simulation Plugin Configuration
# ============================================================
#
# 这是一个事件及人体模拟插件的配置文件
# This is the configuration file for the Event and Human Simulation Plugin
#
# 配置说明 / Configuration Notes:
# - 所有提示词都在此配置文件中 / All prompts are in this config file
# - 可以直接修改提示词内容 / You can modify prompt content directly
# - 模型配置可以指定使用哪个模型 / Model configuration can specify which model to use
# - 默认模型类型: tool_use, planner, replyer / Default model types: tool_use, planner, replyer
# - 留空表示使用系统默认模型 / Leave empty to use system default model
#
# ============================================================

# ============================================================
# [plugin] - 插件基础配置 / Basic Plugin Configuration
# ============================================================
[plugin]
# 配置文件版本 / Config file version
# 请勿手动修改此值 / Do not modify this value manually
config_version = "1.1.0"

# 是否启用插件 / Enable plugin
enabled = true

# 状态更新间隔（秒）/ State update interval (seconds)
# 建议：60-300秒 / Recommended: 60-300 seconds
update_interval = 60

# 数据目录 / Data directory
# 相对于插件目录 / Relative to plugin directory
data_dir = "data"

# ============================================================
# [features] - 功能开关配置 / Feature Toggle Configuration
# ============================================================
[features]
# 是否启用启动处理器 / Enable startup handler
# 负责插件启动时的初始化工作 / Handles plugin initialization on startup
startup_enabled = true

# 是否启用停止处理器 / Enable stop handler
# 负责插件停止时的清理工作 / Handles plugin cleanup on stop
stop_enabled = true

# 是否启用状态更新处理器 / Enable state update handler
# 负责定期更新机器人状态 / Handles periodic state updates
state_update_enabled = true

# 是否启用消息事件处理器 / Enable message event handler
# 负责处理消息事件，更新疲劳度、饥饿度等 / Handles message events, updates fatigue, hunger, etc.
message_event_enabled = true

# 是否启用社交网络功能 / Enable social network feature
# 负责管理用户关系和亲密度 / Manages user relationships and intimacy
social_network_enabled = true

# 是否启用睡眠系统 / Enable sleep system
# 负责管理睡眠状态和消息拦截 / Manages sleep state and message blocking
sleep_system_enabled = true

# 是否启用活动执行功能 / Enable activity execution feature
# 负责执行日程中的活动 / Executes scheduled activities
activity_execution_enabled = true

# 是否启用随机事件处理功能 / Enable random event handling feature
# 负责处理随机事件 / Handles random events
event_handling_enabled = true

# 是否启用命令功能 / Enable command feature
# 负责处理用户命令 / Handles user commands
commands_enabled = true

# 是否启用工具功能 / Enable tool feature
# 负责提供LLM可调用的工具 / Provides tools for LLM to call
tools_enabled = true

# ============================================================
# 命令开关配置 / Command Toggle Configuration
# ============================================================

# 是否启用状态查询命令 / Enable status query command
status_command_enabled = true

# 是否启用日程查询命令 / Enable schedule query command
schedule_command_enabled = true

# 是否启用社交网络查询命令 / Enable social network query command
social_network_command_enabled = true

# ============================================================
# [ai] - AI模型配置 / AI Model Configuration
# ============================================================
[ai]
# 日程生成模型配置 / Schedule generation model configuration
# 格式1: 使用预定义模型类型 / Format 1: Use predefined model type
#   schedule_model = "replyer"
# 格式2: 指定具体模型名称 / Format 2: Specify specific model name
#   schedule_model = "replyer:gpt-4"
#   schedule_model = "replyer:claude-3-sonnet"
#   schedule_model = "tool_use:gpt-4-turbo"
# 留空使用 replyer 模型 / Leave empty to use replyer model
# 可选值: tool_use, planner, replyer, utils, vlm, voice, embedding, lpmm_entity_extract, lpmm_rdf_build, 或 "类型:模型名称"
# Options: tool_use, planner, replyer, utils, vlm, voice, embedding, lpmm_entity_extract, lpmm_rdf_build, or "type:model_name"
schedule_model = "replyer"

# 随机事件生成模型配置 / Random event generation model configuration
# 格式同上 / Same format as above
# 示例 / Examples:
#   event_model = "tool_use"
#   event_model = "tool_use:gpt-4"
event_model = "tool_use"

# 情绪判断模型配置 / Emotion judgment model configuration
# 格式同上 / Same format as above
# 示例 / Examples:
#   emotion_model = "planner"
#   emotion_model = "planner:gpt-4"
emotion_model = "planner"

# 习惯生成模型配置 / Habit generation model configuration
# 格式同上 / Same format as above
# 示例 / Examples:
#   habit_model = "replyer"
#   habit_model = "replyer:gpt-4"
habit_model = "replyer"

# AI温度 / AI temperature
# 范围: 0.0-2.0，越高越随机 / Range: 0.0-2.0, higher means more random
temperature = 0.7

# AI最大token数 / AI max tokens
# 建议: 500-2000 / Recommended: 500-2000
# 日程生成需要更多token，建议设置为2000-2500 / Schedule generation needs more tokens, recommended 2000-2500
max_tokens = 2500

# ============================================================
# 可用模型配置说明 / Available Model Configurations
# ============================================================
# utils - 工具模型（表情包、取名、关系、情绪等）/ Utility model (emoji, naming, relationship, emotion, etc.)
# tool_use - 工具调用模型 / Tool calling model
# replyer - 回复生成模型 / Reply generation model
# planner - 决策模型 / Decision-making model
# vlm - 图像识别模型 / Visual Language Model (image recognition)
# voice - 语音识别模型 / Voice recognition model
# embedding - 嵌入模型 / Embedding model (for knowledge base)
# lpmm_entity_extract - 实体提取模型 / Entity extraction model
# lpmm_rdf_build - RDF构建模型 / RDF building model

# ============================================================
# [prompts] - AI提示词配置 / AI Prompts Configuration
# ============================================================
[prompts]
# 日程生成提示词 / Schedule generation prompt
# 支持的变量 / Supported variables:
#   {current_time} - 当前时间 / Current time
#   {current_date} - 当前日期 / Current date
#   {day_of_week} - 星期 / Day of week
#   {is_weekend} - 是否周末 / Is weekend
#   {is_holiday} - 是否节假日 / Is holiday
#   {holiday_name} - 节日名称 / Holiday name
#   {health_status} - 健康状态 / Health status
#   {illness_name} - 疾病名称 / Illness name
#   {illness_reason} - 生病原因 / Illness reason
#   {illness_symptoms} - 症状描述 / Illness symptoms
#   {illness_treatment} - 治疗建议 / Illness treatment
#   {fatigue_level} - 疲劳度 / Fatigue level
#   {hunger_level} - 饥饿度 / Hunger level
#   {personality} - 人格特点 / Personality
#   {habits} - 个人习惯 / Personal habits
schedule_generation = """你是一个生活规划助手，需要为机器人生成今天的日程安排。

请根据以下信息生成一个合理的日程：
- 当前时间：{current_time}
- 当前日期：{current_date}
- 星期：{day_of_week}
- 是否周末：{is_weekend}
- 是否节假日：{is_holiday}
- 当前健康状态：{health_status}
- 当前疲劳度：{fatigue_level}/100
- 当前饥饿度：{hunger_level}/100

人格特点：
{personality}

个人习惯：
{habits}

【疾病信息】
- 疾病名称：{illness_name}
- 生病原因：{illness_reason}
- 症状描述：{illness_symptoms}
- 治疗建议：{illness_treatment}

请生成今天的完整日程安排（00:00-23:59），格式为JSON数组，每个元素包含：
- start_time: 开始时间（HH:MM格式）
- end_time: 结束时间（HH:MM格式）
- activity_type: 活动类型（work, leisure, meal, sleep, exercise, study, other, rest, medical）
- description: 活动描述（使用计划性用词，如"计划"、"安排"、"准备"等）
- priority: 优先级（1-5，5最高）

【重要】日程要求：
1. 必须生成完整的一天的日程，从00:00到23:59，不要生成跨天的日程
2. 所有活动的时间必须在今天（{current_date}）范围内
3. 每个活动必须有明确的开始时间和结束时间，时间段之间不能有空隙
4. 活动描述必须使用计划性用词，如"计划"、"安排"、"准备"、"将"、"打算"等
5. 必须包含早上起床（如07:00-08:00）、上午活动、午餐、下午活动、晚餐、晚上活动、睡觉等
6. 不要从当前时间开始生成，要从00:00开始生成完整的一整天
7. 日程要符合人格特点和个人习惯

注意：
1. 日程要符合人格特点和个人习惯
2. 活动描述示例：
   - "计划起床洗漱"
   - "安排早餐时间"
   - "准备开始工作"
   - "计划午休"
   - "安排运动时间"
   - "准备晚餐"
   - "计划休息"
   - "准备睡觉"
3. 生病系统调整（健康度越高越健康）/ Illness system adjustment (higher health is healthier):
   - healthy (80-100): 正常日程，可安排工作、运动、娱乐 / Normal schedule, can arrange work, exercise, entertainment
   - recovering (60-79): 减少工作强度，安排康复活动 / Reduce work intensity, arrange recovery activities
   - slightly_ill (40-59): 减少工作，增加休息时间 / Reduce work, increase rest time
   - ill (20-39): 主要安排休息、轻度活动 / Mainly rest and light activities
   - seriously_ill (0-19): 只安排休息、医疗活动、必要的生活活动 / Only rest, medical activities, and essential life activities
4. 【重要】如果有疾病信息，必须根据具体疾病调整日程：
   - 根据疾病症状安排合适的活动（如感冒避免剧烈运动，胃病避免辛辣食物）
   - 根据治疗建议安排医疗活动（如按时吃药、去医院检查）
   - 根据疾病严重程度调整休息时间（严重疾病需要更多休息）
   - 疾病相关的活动描述应该具体（如"计划服用感冒药"、"安排去医院检查"、"准备喝温水"等）
5. 如果疲劳度高（>70），要安排更多休息 / If fatigue is high (>70), arrange more rest
6. 如果饥饿度高（>70），要优先安排用餐 / If hunger is high (>70), prioritize meals
7. 节假日可以安排更多休闲活动 / Holidays can have more leisure activities
8. 确保三餐时间合理 / Ensure reasonable meal times
9. 确保有足够的睡眠时间 / Ensure sufficient sleep time
10. 生病时可以安排医疗活动（medical）和休息活动（rest）/ When ill, can arrange medical activities and rest
11. 日程应该包含8-15个活动，覆盖一整天 / Schedule should contain 8-15 activities covering the whole day
12. 睡觉时间应该安排在晚上（如22:00-23:59），不要安排到明天凌晨 / Sleep time should be scheduled in the evening (e.g., 22:00-23:59), not tomorrow morning
13. 时间段必须连续，不能重叠或遗漏 / Time slots must be continuous, no overlaps or gaps

请只返回JSON数组，不要有其他内容。"""

