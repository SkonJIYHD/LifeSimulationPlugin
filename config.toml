# [social_network] - 社交网络配置 / Social Network Configuration
# ============================================================
[social_network]
# 是否启用社交网络 / Enable social network
enabled = true

# 亲密度增长方式 / Intimacy growth method
# ai: AI判断是否增加亲密度及增加多少 / ai: AI determines if and how much intimacy increases
# probability: 概率增加 / probability: Probability-based increase
# fixed: 固定增加 / fixed: Fixed increase
# 建议: ai / Recommended: ai
intimacy_growth_method = "ai"

# 亲密度增长率（仅在 growth_method = fixed 时生效）/ Intimacy growth rate (only when growth_method = fixed)
# 每次互动增加的亲密度 / Intimacy increase per interaction
# 建议: 1-5 / Recommended: 1-5
intimacy_growth_rate = 1

# 亲密度增长概率（仅在 growth_method = probability 时生效）/ Intimacy growth probability (only when growth_method = probability)
# 每次互动增加亲密度的概率 / Probability of intimacy increase per interaction
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 建议: 0.3-0.7 / Recommended: 0.3-0.7
intimacy_growth_probability = 0.5

# 亲密度AI判断模型（仅在 growth_method = ai 时生效）/ Intimacy AI judgment model (only when growth_method = ai)
# 留空使用 replyer 模型 / Leave empty to use replyer model
intimacy_ai_model = "replyer"

# 亲密度衰减率 / Intimacy decay rate
# 每次衰减减少的亲密度 / Intimacy decrease per decay
# 建议: 0.1-1.0 / Recommended: 0.1-1.0
intimacy_decay_rate = 0.1

# 衰减间隔（秒）/ Decay interval (seconds)
# 亲密度衰减的时间间隔 / Time interval for intimacy decay
# 默认: 86400秒（24小时）/ Default: 86400 seconds (24 hours)
decay_interval = 86400

