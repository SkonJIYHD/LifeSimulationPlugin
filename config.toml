# 生病概率倍数 / Illness probability multiplier
# 范围: 0.0-2.0 / Range: 0.0-2.0
# 0.5 = 降低生病概率 / 0.5 = Reduce illness probability
# 1.0 = 正常概率 / 1.0 = Normal probability
# 2.0 = 提高生病概率 / 2.0 = Increase illness probability
illness_probability_multiplier = 1.0

# 生病时是否自动重新生成日程 / Auto regenerate schedule on illness
# true: 生病后自动重新生成符合病情的日程 / true: Auto regenerate schedule based on illness
# false: 生病后不自动重新生成日程 / false: Do not auto regenerate schedule on illness
auto_regenerate_on_illness = true

# ============================================================
# 健康状态说明 / Health Status Description
# ============================================================
# 健康度范围：0-100（越高越健康）/ Health range: 0-100 (higher is healthier)
# healthy (80-100): 健康 / Healthy
# recovering (60-79): 康复中 / Recovering
# slightly_ill (40-59): 轻微不适 / Slightly ill
# ill (20-39): 生病 / Ill
# seriously_ill (0-19): 严重生病 / Seriously ill
# 
# 生病事件会降低健康度 / Illness events reduce health
# 康复事件会提高健康度 / Recovery events increase health

# ============================================================
# [time_api] - 时间日期API配置 / Time and Date API Configuration
# ============================================================
[time_api]
# 时间日期获取方式 / Time and date method
# builtin: 使用内置datetime / builtin: Use built-in datetime
# custom: 使用自定义API / custom: Use custom API
method = "builtin"

# 自定义时间API URL (仅在 method = "custom" 时生效)/ Custom time API URL (only when method = "custom")
# 示例 / Example: "https://worldtimeapi.org/api/timezone/Asia/Shanghai"
# 需要返回JSON格式，包含 datetime 字段 / Must return JSON with datetime field
url = ""

# 自定义时间API请求超时（秒）/ Custom time API request timeout (seconds)
timeout = 5

# ============================================================
# [holiday_api] - 节日API配置 / Holiday API Configuration
# ============================================================
[holiday_api]
# 是否启用节日检测 / Enable holiday detection
enabled = true

# 节日API URL / Holiday API URL
# 默认使用 timor.tech 免费API / Default: timor.tech free API
url = "https://timor.tech/api/holiday/info/{date}"

# 节日信息缓存时长（秒）/ Holiday info cache duration (seconds)
# 默认: 86400秒（24小时）/ Default: 86400 seconds (24 hours)
cache_duration = 86400

# 请求超时（秒）/ Request timeout (seconds)
timeout = 5

# ============================================================
# [commands] - 命令配置 / Commands Configuration
# ============================================================
[commands]
# 是否启用所有命令 / Enable all commands
enabled = true

# 状态查询命令 / Status query command
[commands.status]
enabled = true
command = "/life_status"
description = "查询当前状态 / Query current status"

# 日程查询命令 / Schedule query command
[commands.schedule]
enabled = true
command = "/life_schedule"
description = "查询日程安排 / Query schedule"

# ============================================================
# [state] - 状态配置 / State Configuration
# ============================================================
[state]
# 状态保存文件名 / State save filename
# 相对于 data_dir / Relative to data_dir
filename = "state.json"

# 自动保存间隔（秒）/ Auto-save interval (seconds)
# 0 = 不自动保存 / 0 = No auto-save
# 建议: 300-600秒 / Recommended: 300-600 seconds
auto_save_interval = 300

# 消息状态更新概率 / Message state update probability
# 每次收到消息时，按此概率增加疲劳度和饥饿度
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 0.0 = 永不更新 / 0.0 = Never update
# 0.7 = 70%概率更新 / 0.7 = 70% probability to update
# 1.0 = 每次都更新 / 1.0 = Update every time
# 建议: 0.3-0.8 / Recommended: 0.3-0.8
message_state_update_probability = 0.7

# ============================================================
# [sleep] - 睡眠系统配置 / Sleep System Configuration
# ============================================================
[sleep]
# 是否启用睡眠系统 / Enable sleep system
enabled = true

# 最短睡眠时间（小时）/ Minimum sleep duration (hours)
# 防止睡眠过短 / Prevent sleeping too short
# 建议: 4-6小时 / Recommended: 4-6 hours
min_sleep_hours = 4

# 最长睡眠时间（小时）/ Maximum sleep duration (hours)
# 防止睡眠过长 / Prevent sleeping too long
# 建议: 8-12小时 / Recommended: 8-12 hours
max_sleep_hours = 10

# 是否允许手动唤醒 / Allow manual wake-up
allow_manual_wake = true

# AI自动回复配置 / AI auto-reply configuration
# 是否启用AI判断自动回复 / Enable AI judgment for auto-reply
ai_reply_enabled = true

# AI模型 / AI model
# 留空使用 replyer 模型 / Leave empty to use replyer model
ai_model = "replyer"

# AI回复概率 / AI reply probability
# AI判断应该回复后，实际回复的概率
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 建议: 0.2-0.5 / Recommended: 0.2-0.5
ai_reply_probability = 0.3

# 打扰唤醒配置 / Disturbance wake-up configuration
# 是否启用打扰唤醒 / Enable disturbance wake-up
disturbance_enabled = true

# 浅睡唤醒概率 / Light sleep wake-up probability
# 浅睡时被消息吵醒的概率 / Probability of being woken by messages during light sleep
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 建议: 0.3-0.7 / Recommended: 0.3-0.7
light_sleep_wake_prob = 0.5

# 深睡唤醒概率 / Deep sleep wake-up probability
# 深睡时被消息吵醒的概率 / Probability of being woken by messages during deep sleep
# 范围: 0.0-1.0 / Range: 0.0-1.0
# 建议: 0.05-0.2 / Recommended: 0.05-0.2
deep_sleep_wake_prob = 0.1

# 消息频率阈值 / Message frequency threshold
# 每分钟超过此数量的消息可能被吵醒 / Messages per minute threshold for possible wake-up
# 建议: 2-5 / Recommended: 2-5
message_freq_threshold = 3

# 亲密度唤醒阈值 / Intimacy wake-up threshold
# 关系亲密的用户（亲密度 > 阈值）可能唤醒 / Users with intimacy above threshold may wake up
# 范围: 0-100 / Range: 0-100
# 建议: 50-80 / Recommended: 50-80
intimacy_wake_threshold = 60

# 默认自动回复 / Default auto-reply
# AI不回复时使用的默认消息 / Default message when AI doesn't reply
# 留空则不回复 / Leave empty to not reply
sleep_reply = "我现在在睡觉，明天再聊~"

# ============================================================
# 睡眠状态说明 / Sleep State Description
# ============================================================
# 睡眠状态 / Sleep states:
# - awake (清醒): 正常活动，可以回复消息 / Normal activity, can reply
# - sleepy (困倦): 疲劳度较高，准备入睡 / High fatigue, preparing to sleep
# - falling_asleep (入睡中): 正在入睡，不回复 / Falling asleep, no reply
# - light_sleep (浅睡): 轻度睡眠，不回复，可能被吵醒 / Light sleep, no reply, may be woken
# - deep_sleep (深睡): 深度睡眠，不回复，难以被吵醒 / Deep sleep, no reply, hard to wake
# - waking_up (醒来中): 正在醒来，不回复 / Waking up, no reply
#
# 日程联动 / Schedule integration:
# - 当前日程为睡眠活动时自动入睡 / Automatically sleep when current activity is sleep
# - 日程切换时自动醒来 / Automatically wake up when schedule changes
#
# AI自动回复 / AI auto-reply:
# - AI根据睡眠状态、消息内容、关系亲密度判断是否回复
# - AI judges whether to reply based on sleep state, message content, and relationship
#
# 打扰唤醒 / Disturbance wake-up:
# - 浅睡时可能被大量消息、重要消息、紧急关键词吵醒
# - Light sleep may be woken by frequent messages, important messages, or urgent keywords
# - 深睡时很难被吵醒 / Deep sleep is hard to wake

