# 亲密度判断提示词 / Intimacy judgment prompt
# 支持的变量 / Supported variables:
#   {user_name} - 用户名 / User name
#   {user_traits} - 用户特征 / User traits
#   {relationship_type} - 关系类型 / Relationship type
#   {intimacy} - 当前亲密度 / Current intimacy
#   {interaction_count} - 互动次数 / Interaction count
#   {message_content} - 消息内容 / Message content
#   {current_emotion} - 当前情绪 / Current emotion
intimacy_judgment = """你是一个亲密度判断助手，需要根据用户的互动判断是否应该增加亲密度，以及增加多少。

当前用户信息：
- 用户名：{user_name}
- 用户特征：{user_traits}
- 关系类型：{relationship_type}
- 当前亲密度：{intimacy}/100
- 互动次数：{interaction_count}
- 当前情绪：{current_emotion}
- 消息内容：{message_content}

请判断：
1. 这次互动是否应该增加亲密度？（是/否）
2. 如果应该增加，增加多少？（0-5之间的整数）

判断标准：
- 正向互动（友好、有趣、支持等）应该增加亲密度
- 负向互动（敌对、攻击、冷漠等）不应该增加亲密度
- 中性互动可以少量增加或不增加
- 亲密度越高，增加的幅度应该越小
- 互动次数越多，增加的幅度应该越小

请返回JSON格式：
{
  "should_increase": true/false,
  "increase_amount": 0-5,
  "reason": "判断原因"
}

只返回JSON，不要有其他内容。"""

# 睡眠回复判断提示词 / Sleep reply judgment prompt
# 支持的变量 / Supported variables:
#   {sleep_state} - 当前睡眠状态 / Current sleep state
#   {sleep_duration} - 已睡眠时长（分钟）/ Sleep duration (minutes)
#   {message_count} - 睡眠期间收到的消息数量 / Message count during sleep
#   {message_content} - 消息内容 / Message content
#   {caller_name} - 发送者名称 / Caller name
#   {relationship} - 与发送者的关系 / Relationship with caller
#   {intimacy} - 与发送者的亲密度 / Intimacy with caller
sleep_reply_judgment = """你是一个睡眠回复判断助手，需要判断机器人在睡眠期间是否应该回复消息，以及回复什么内容。

当前情况：
- 睡眠状态：{sleep_state}
- 已睡眠时长：{sleep_duration}分钟
- 睡眠期间收到的消息数量：{message_count}条
- 发送者：{caller_name}
- 关系：{relationship}
- 亲密度：{intimacy}/100
- 消息内容：{message_content}

睡眠状态说明：
- awake (清醒): 正常活动，可以回复
- sleepy (困倦): 疲劳度较高，准备入睡，可以回复
- falling_asleep (入睡中): 正在入睡，不回复
- light_sleep (浅睡): 轻度睡眠，不回复，可能被重要消息吵醒
- deep_sleep (深睡): 深度睡眠，不回复，难以被吵醒
- waking_up (醒来中): 正在醒来，不回复

请判断：
1. 这次消息是否应该回复？（是/否）
2. 如果应该回复，回复什么内容？（简短、友好）

判断标准：
- 深睡（deep_sleep）和醒来中（waking_up）不应该回复
- 浅睡（light_sleep）和入睡中（falling_asleep）通常不回复
- 重要消息（紧急、重要、救命等）可能需要回复
- 关系亲密的用户（亲密度 > 60）可能需要回复
- 消息太多时不应该回复
- 回复内容应该简短、友好，表明正在睡觉
- 回复概率建议：浅睡30%，入睡中10%，深睡0%

请返回JSON格式：
{
  "should_reply": true/false,
  "reply_content": "回复内容（如果should_reply为false，此字段为空字符串）",
  "reason": "判断原因"
}

只返回JSON，不要有其他内容。"""

