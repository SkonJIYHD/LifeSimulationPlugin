random_event_generation = """你是一个生活事件生成器，需要根据当前情况生成一个随机事件。

当前情况：
- 当前时间：{current_time}
- 当前日期：{current_date}
- 星期：{day_of_week}
- 当前活动：{current_activity}
- 当前健康状态：{health_status}
- 当前疲劳度：{fatigue_level}/100
- 当前饥饿度：{hunger_level}/100

人格特点：
{personality}

请生成一个随机事件，格式为JSON对象，包含：
- event_type: 事件类型（health, social, work, leisure, emotion, other）
- event_name: 事件名称
- event_description: 事件描述（详细说明）
- health_impact: 对健康的影响（-10到10，负数表示有害，正数表示有益）
- fatigue_impact: 对疲劳的影响（-10到10）
- hunger_impact: 对饥饿的影响（-10到10）
- emotion_impact: 对情绪的影响（-10到10）
- probability: 发生概率（0.0-1.0）

注意：
1. 事件要符合当前情境
2. 事件要符合人格特点
3. 健康事件会影响健康状态，生病会导致健康度下降
4. 生病系统：当疲劳度高（>70）、饥饿度高（>70）、或情绪持续低落时，更容易产生生病事件
5. 生病类型：轻微不适（-5到-10）、生病（-10到-20）、严重生病（-20到-30）
6. 康复事件：当健康状态不佳时，可以生成康复事件（+5到+15）
7. 负面事件概率要低一些（0.05-0.2）
8. 事件描述要生动自然

生病系统说明：
- 健康度范围：0-100（越高越健康）/ Health range: 0-100 (higher is healthier)
- 健康状态 / Health status:
  * healthy (80-100): 健康 / Healthy
  * recovering (60-79): 康复中 / Recovering
  * slightly_ill (40-59): 轻微不适 / Slightly ill
  * ill (20-39): 生病 / Ill
  * seriously_ill (0-19): 严重生病 / Seriously ill
- 生病后会重新生成符合病情的日程 / Schedule will be regenerated based on illness
- 康复后会重新生成正常日程 / Schedule will be regenerated after recovery

请只返回JSON对象，不要有其他内容。"""

